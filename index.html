<script>
const statusLine=document.querySelector("#status");
statusLine.textContent="Three.js r128 yükleniyor…";
function showError(message){
  statusLine.hidden=false;
  statusLine.textContent=message;
  document.querySelector("#menu").hidden=false;
  document.querySelector("#start").disabled=true;
  document.querySelector("#pause").hidden=true;

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
"use strict";
try {
if(!window.THREE || THREE.REVISION!=="128"){
  throw new Error("Three.js r128 yüklenemedi. cdn.jsdelivr.net erişimini ve internet bağlantını kontrol edip dosyayı yeniden aç.");
}
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const follow = (a, b, rate, dt) => b + (a-b)*Math.exp(-rate*dt);

// World coordinates are metres; negative Z points down the valley.
function ground(x,z) {
  return .254*z + 2.4*Math.sin(x*.042+z*.023) + 1.5*Math.cos(z*.071-x*.026)
    + .36*Math.sin(x*.114+z*.092) + .15*Math.cos(z*.19-x*.08);
}

class Ride {
  constructor() {
    Object.assign(this,{x:0,z:0,speed:0,heading:0,edge:0,slip:0,shake:0,roll:0,grace:0});
  }
  step(dt,input) {
    this.edge = follow(this.edge,input.steer,5,dt);
    const brake = input.brake;
    const desiredSlip = Math.max(brake,clamp((Math.abs(this.edge)-.75)*3,0,1));
    this.slip = follow(this.slip,desiredSlip,7,dt);
    const turnRate = this.edge*(.32+.26*this.slip)*Math.min(this.speed/4,1);
    this.heading = clamp(this.heading+turnRate*dt,-1.2,1.2);
    const dx = Math.sin(this.heading), dz = -Math.cos(this.heading);
    const grade = ground(this.x,this.z)-ground(this.x+dx,this.z+dz);
    const acceleration = 9.81*grade/Math.hypot(1,grade)-.1-.0028*this.speed**2-8*this.slip;
    this.speed = Math.max(0,this.speed+acceleration*dt);
    const travel = this.speed*dt/Math.hypot(1,grade);
    this.x += dx*travel;
    this.z += dz*travel;
    this.roll = follow(this.roll,this.edge*Math.min(1,this.speed/9)*.48,4,dt);
    this.shake = Math.max(0,this.shake-dt*2);
    this.grace = Math.max(0,this.grace-dt);
  }
  fall() {
    this.speed=0; this.shake=1; this.grace=2; this.heading=0;
  }
}

class TouchControls {
  constructor(canvas) {
    this.points=new Map();
    this.keys=new Set();
    const release=e=>this.points.delete(e.pointerId);
    canvas.onpointerdown=e=>{
      canvas.setPointerCapture(e.pointerId);
      this.points.set(e.pointerId,{left:e.clientX<innerWidth*.5,x:e.clientX,y:e.clientY,dx:0,dy:0});
    };
    canvas.onpointermove=e=>{
      const p=this.points.get(e.pointerId);
      if(p){ p.dx=e.clientX-p.x; p.dy=e.clientY-p.y; }
    };
    canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=release;
    window.addEventListener("keydown",e=>{
      if(["ArrowLeft","ArrowRight","ArrowDown"].includes(e.key)){
        e.preventDefault(); this.keys.add(e.key);
      }
    });
    window.addEventListener("keyup",e=>this.keys.delete(e.key));
  }
  reset(){ this.points.clear(); this.keys.clear(); }
  read(){
    const touches=[...this.points.values()];
    const left=touches.find(p=>p.left), right=touches.find(p=>!p.left);
    const span=Math.min(innerWidth*.19,140);
    return {
      steer:clamp((left?.dx||0)/span+Number(this.keys.has("ArrowRight"))-Number(this.keys.has("ArrowLeft")),-1,1),
      brake:touches.length>=2||this.keys.has("ArrowDown")?1:clamp(((left?.dy||0)-14)/70,0,1),
      yaw:clamp((right?.dx||0)/span,-1,1)*.95,
      pitch:clamp(-(right?.dy||0)/span,-1,1)*.38
    };
  }
}

const sunDirection=new THREE.Vector3(-.57,.26,-.82).normalize();
function hash(x,y) {
  const v=Math.sin(x*127.1+y*311.7)*43758.5453;
  return v-Math.floor(v);
}
function noise(x,y) {
  const i=Math.floor(x), j=Math.floor(y);
  let u=x-i,v=y-j;
  u=u*u*(3-2*u); v=v*v*(3-2*v);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(hash(i,j),hash(i+1,j),u),
    THREE.MathUtils.lerp(hash(i,j+1),hash(i+1,j+1),u),v);
}
function snowTexture(){
  const size=256, data=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const ripple=Math.cos(2*Math.PI*(y*19/size+.29*Math.sin(x*2*Math.PI/size*3)));
    const value=207+6*ripple+33*hash(x,y);
    const k=(y*size+x)*4;
    data.set([value,value,Math.min(255,value+3),255],k);
  }
  const t=new THREE.DataTexture(data,size,size);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.generateMipmaps=true; t.anisotropy=4; t.encoding=THREE.sRGBEncoding; t.needsUpdate=true;
  return t;
}
function mountains(scene){
  const group=new THREE.Group();
  for(let band=0;band<2;band++){
    const positions=[],colors=[],indices=[];
    const count=420,rows=38;
    for(let j=0;j<=rows;j++) for(let i=0;i<=count;i++){
      const a=i/count*Math.PI*2, t=j/rows, c=Math.cos(a),s=Math.sin(a);
      const ridge=.56+.13*(noise(c*5+band,s*5)-.5);
      const flank=t<ridge?t/ridge:(1-t)/(1-ridge);
      const rough=noise(33*c+t*7,33*s+t*4)+.48*noise(77*c+t*17,77*s+t*12);
      const summit=92+146*noise(6*c+band,6*s+2*band)+60*noise(15*c,15*s);
      const height=-165+flank*(summit+65*band)+rough*33*flank;
      const radius=420+band*280+t*440;
      positions.push(c*radius,height,s*radius);
      const exposed=clamp((rough-.68)*2.6+(ridge-t)*.8,0,.94);
      const col=new THREE.Color(0xeae2e3).lerp(new THREE.Color(0x484553),exposed);
      colors.push(col.r,col.g,col.b);
      if(j<rows && i<count){
        const k=j*(count+1)+i;
        indices.push(k,k+1,k+count+1,k+1,k+count+2,k+count+1);
      }
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
    geo.setIndex(indices); geo.computeVertexNormals();
    group.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));
  }
  scene.add(group);
  return group;
}

class World {
  constructor(scene){
    this.scene=scene;
    scene.fog=new THREE.FogExp2(0xd7bdcd,.00165);
    this.sky=new THREE.Mesh(new THREE.SphereGeometry(1450,32,20),new THREE.ShaderMaterial({
      side:THREE.BackSide,depthWrite:false, uniforms:{sun:{value:sunDirection}},
      vertexShader:'varying vec3 d; void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader:`varying vec3 d; uniform vec3 sun;
      float cloudNoise(vec2 p){
        vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        vec4 h=fract(sin(dot(i,vec2(127.1,311.7))+vec4(0.,127.1,311.7,438.8))*4375.8);
        return mix(mix(h.x,h.y,f.x),mix(h.z,h.w,f.x),f.y);
      }
      void main(){
        vec3 n=normalize(d); float h=max(n.y,0.);
        vec3 col=mix(vec3(.73,.54,.63),vec3(.27,.32,.51),smoothstep(.0,.62,h));
        vec2 uv=n.xz/max(.08,h)*vec2(2.,5.);
        float wisps=cloudNoise(uv)*.58+cloudNoise(uv*2.2)*.28+cloudNoise(uv*5.)*.14;
        col=mix(col,vec3(.88,.73,.76),smoothstep(.49,.78,wisps)*smoothstep(.03,.22,h)*.47);
        float dist=length(n-sun);
        col+=vec3(.64,.32,.11)*exp(-dist*6.)+vec3(1.,.81,.58)*(1.-smoothstep(.013,.019,dist));
        gl_FragColor=vec4(col,1.);
        #include <encodings_fragment>
      }`
    }));
    scene.add(this.sky);
    this.range=mountains(scene);
    scene.add(new THREE.HemisphereLight(0xf4deeb,0x837992,1.55));
    this.sun=new THREE.DirectionalLight(0xffdfbc,2.0);
    this.sun.castShadow=true;
    Object.assign(this.sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:100});
    this.sun.shadow.mapSize.set(1024,1024);
    this.sun.shadow.normalBias=.018;
    this.sun.shadow.bias=-.00015;
    this.sun.position.copy(sunDirection).multiplyScalar(42);
    scene.add(this.sun,this.sun.target);
    const tex=snowTexture();
    this.snow=new THREE.MeshStandardMaterial({map:tex,bumpMap:tex,bumpScale:.018,roughness:.92});
    this.tiles=[];
    for(let i=0;i<49;i++){
      const geo=new THREE.PlaneGeometry(96,96,32,32);
      geo.rotateX(-Math.PI/2);
      const uv=geo.attributes.uv;
      for(let k=0;k<uv.count;k++) uv.setXY(k,uv.getX(k)*24,uv.getY(k)*24);
      const mesh=new THREE.Mesh(geo,this.snow);
      mesh.receiveShadow=true;
      scene.add(mesh);
      this.tiles.push(mesh);
    }
    this.rocks=[];
    const rockMaterial=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1});
    for(let i=0;i<15;i++){
      const stone=new THREE.IcosahedronGeometry(1,3), p=stone.attributes.position;
      const colors=[];
      for(let k=0;k<p.count;k++){
        const x=p.getX(k),y=p.getY(k),z=p.getZ(k);
        const grain=noise(8*x+z,i+y*7), relief=.78+.36*noise(x*3+i,z*4+y)+.08*grain;
        p.setXYZ(k,x*relief,y*relief,z*relief);
        const color=new THREE.Color(0x514b52).lerp(new THREE.Color(0xe6dbe0),
          clamp((y-.35)*2+grain*.65-.32,0,1));
        colors.push(color.r,color.g,color.b);
      }
      stone.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
      stone.computeVertexNormals();
      const mesh=new THREE.Mesh(stone,rockMaterial);
      mesh.castShadow=mesh.receiveShadow=true; scene.add(mesh); this.rocks.push(mesh);
    }
  }
  update(r){
    const base=ground(r.x,r.z);
    const cx=Math.round(r.x/96),cz=Math.round(r.z/96);
    for(let j=-3;j<=3;j++) for(let i=-3;i<=3;i++){
      const ix=cx+i,iz=cz+j, wx=ix*96,wz=iz*96;
      const tile=this.tiles[((iz%7+7)%7)*7+(ix%7+7)%7];
      if(tile.userData.ix!==ix||tile.userData.iz!==iz){
        Object.assign(tile.userData,{ix,iz});
        const geo=tile.geometry,p=geo.attributes.position;
        for(let k=0;k<p.count;k++) p.setY(k,ground(wx+p.getX(k),wz+p.getZ(k))-.254*wz);
        p.needsUpdate=true; geo.computeVertexNormals(); geo.computeBoundingSphere();
      }
      tile.position.set(wx-r.x,.254*wz-base,wz-r.z);
    }
    const row=Math.round(r.z/65), col=Math.round(r.x/45);
    let n=0;
    for(let j=-3;j<=1;j++) for(let i=-1;i<=1;i++){
      const a=col+i,b=row+j, rock=this.rocks[n++];
      const x=a*45+(hash(a,b)-.5)*28+10,z=b*65+(hash(b+7,a)-.5)*30;
      const size=.8+1.8*hash(a-5,b);
      rock.scale.set(size,size*.6,size*.84);
      rock.position.set(x-r.x,ground(x,z)-base-.15,z-r.z);
      rock.rotation.y=hash(b,a)*5;
      if(!r.grace && r.speed>4 && Math.hypot(x-r.x,(z-r.z)/.84)<size+.2) r.fall();
    }
  }
}

function skiGeometry(){
  const positions=[],indices=[];
  for(let i=0;i<=24;i++){
    const t=i/24,z=.53-2.29*t,tip=clamp((t-.77)/.23,0,1);
    const y=.045+.20*tip*tip;
    const width=(.054+.018*Math.cos(t*2*Math.PI))*(1-.82*tip**3);
    positions.push(-width,y,z,width,y,z,-width,y-.027,z,width,y-.027,z);
    if(i<24){
      const k=i*4;
      for(const [a,b] of [[0,1],[1,3],[3,2],[2,0]]) indices.push(k+a,k+b,k+a+4,k+b,k+b+4,k+a+4);
    }
  }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
  g.setIndex(indices); g.computeVertexNormals(); return g;
}
class Skier {
  constructor(scene){
    this.root=new THREE.Group(); this.root.rotation.order="YXZ"; scene.add(this.root);
    const ski=new THREE.MeshStandardMaterial({color:0x79392f,metalness:.38,roughness:.37,side:THREE.DoubleSide});
    const hidden=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false});
    const body=new THREE.SphereGeometry(1,14,12);
    const part=(geometry,material,x,y,z,sx,sy,sz)=>{
      const m=new THREE.Mesh(geometry,material); m.position.set(x,y,z); m.scale.set(sx,sy,sz);
      m.castShadow=true; this.root.add(m); return m;
    };
    part(body,hidden,0,1.12,.12,.25,.42,.17);
    part(body,hidden,0,1.64,.04,.15,.18,.16);
    const geom=skiGeometry();
    this.poles=[];
    for(const sign of [-1,1]){
      part(geom,ski,sign*.18,0,0,1,1,1);
      part(body,hidden,sign*.15,.48,.09,.11,.45,.12);
      part(body,hidden,sign*.29,1.12,-.02,.1,.29,.12).rotation.z=sign*.35;
      const pole=part(new THREE.CylinderGeometry(.014,.011,1.23,8),hidden,sign*.42,.52,.1,1,1,1);
      pole.rotation.z=sign*.16; this.poles.push(pole);
    }
    this.yaw=0; this.pitch=0;
  }
  update(r,input,camera,time,dt){
    const base=ground(r.x,r.z),dir=r.heading;
    const skidSign=Math.abs(r.edge)>.08?Math.sign(r.edge):1;
    const angle=dir+skidSign*r.slip*.58;
    const slope=Math.atan(ground(r.x+Math.sin(angle),r.z-Math.cos(angle))-base);
    this.root.rotation.set(slope,-angle,-r.roll*.22,"YXZ");
    this.poles.forEach((p,i)=>p.rotation.x=.31+Math.sin(time*2+i*3)*.12*Math.min(1,r.speed/8));
    this.yaw=follow(this.yaw,input.yaw,7,dt); this.pitch=follow(this.pitch,input.pitch,7,dt);
    camera.position.set(0,1.51+Math.sin(time*44)*.065*r.shake,.08);
    camera.rotation.set(slope*.48-.09+this.pitch+Math.sin(time*31)*.045*r.shake,
      -dir-this.yaw,-r.roll,"YXZ");
  }
}

class SnowEffects {
  constructor(scene){
    this.tracks=[]; this.flakes=[]; this.index=0; this.elapsed=0;
    this.stamps=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({color:0x978ca2,transparent:true,opacity:.32,depthWrite:false}),200);
    this.stamps.count=0; this.stamps.frustumCulled=false; scene.add(this.stamps);
    this.transform=new THREE.Object3D();
    this.positions=new Float32Array(128*3);
    const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(this.positions,3));
    this.spray=new THREE.Points(g,new THREE.PointsMaterial({color:0xffece2,size:.085,transparent:true,opacity:.78,depthWrite:false}));
    this.spray.frustumCulled=false; scene.add(this.spray);
    this.last=null;
  }
  update(r,dt){
    this.elapsed+=dt;
    if(r.speed>1 && r.slip>.15 && this.elapsed>.045){
      const dx=Math.cos(r.heading),dz=Math.sin(r.heading);
      if(this.last){
        for(const s of [-.21,.21]){
          const x=(r.x+this.last.x)/2+dx*s,z=(r.z+this.last.z)/2+dz*s;
          const stamp={x,z,y:ground(x,z)+.035,heading:r.heading,
            length:Math.hypot(r.x-this.last.x,r.z-this.last.z)+.06};
          this.tracks[this.index]=stamp; this.index=(this.index+1)%200;
        }
      }
      this.last={x:r.x,z:r.z};
      const sign=r.edge<0?1:-1;
      for(let i=0;i<5 && this.flakes.length<128;i++){
        const v=sign*(1+Math.random()*3);
        this.flakes.push({x:r.x+sign*.22,y:ground(r.x,r.z)+.09,z:r.z,
          vx:v*dx,vy:1+Math.random()*2.5,vz:v*dz+.5,life:.25+Math.random()*.32});
      }
      this.elapsed=0;
    }else if(r.slip<=.15||r.speed<=1) this.last=null;
    const base=ground(r.x,r.z),o=this.transform;
    this.tracks.forEach((t,i)=>{
      o.position.set(t.x-r.x,t.y-base,t.z-r.z);
      const slope=Math.atan(ground(t.x+Math.sin(t.heading),t.z-Math.cos(t.heading))-ground(t.x,t.z));
      o.rotation.set(slope-Math.PI/2,-t.heading,0,"YXZ"); o.scale.set(.14,t.length,1);
      o.updateMatrix(); this.stamps.setMatrixAt(i,o.matrix);
    });
    this.stamps.count=this.tracks.length; this.stamps.instanceMatrix.needsUpdate=true;
    this.flakes=this.flakes.filter(p=>p.life>0);
    this.flakes.forEach((p,i)=>{
      p.life-=dt; p.vy-=9.81*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      this.positions.set([p.x-r.x,p.y-base,p.z-r.z],3*i);
    });
    this.spray.geometry.setDrawRange(0,this.flakes.length);
    this.spray.geometry.attributes.position.needsUpdate=true;
  }
}

function launch(){
  const canvas=document.querySelector("#view"),menu=document.querySelector("#menu");
  const start=document.querySelector("#start"),pause=document.querySelector("#pause");
  let creationDetail="";
  canvas.addEventListener("webglcontextcreationerror",event=>{creationDetail=event.statusMessage||"";});
  let renderer;
  try {
    renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
  } catch(error){
    throw new Error("WebGL başlatılamadı. "+(creationDetail || error.message));
  }
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,1,.06,1800);
  const world=new World(scene),skier=new Skier(scene),effects=new SnowEffects(scene);
  const ride=new Ride(),controls=new TouchControls(canvas);
  let active=false,previous=0,time=0,dpr=Math.min(1.65,devicePixelRatio);
  let frames=0,sample=0,occlusionTime=-1,visibleSun=false;
  const glare=document.createElement("div");
  glare.className="glare"; canvas.after(glare);
  const solarPoint=new THREE.Vector3();
  const ray=new THREE.Raycaster();
  function resize(){
    renderer.setPixelRatio(dpr); renderer.setSize(innerWidth,innerHeight,false);
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  }
  function setActive(value){
    active=value; menu.hidden=value; pause.hidden=!value; controls.reset();
    previous=0; frames=0; sample=0;
    if(!value){ start.textContent="Devam et"; start.focus(); }
  }
  function frame(now){
    const elapsed=previous?(now-previous)/1000:1/60; previous=now;
    const dt=Math.min(elapsed,.06),input=controls.read();
    if(active){
      for(let remaining=dt;remaining>1e-7;remaining-=1/120) ride.step(Math.min(remaining,1/120),input);
      time+=dt;
      frames++; sample+=elapsed;
      if(sample>=2){
        const fps=frames/sample,limit=Math.min(1.65,devicePixelRatio);
        const next=clamp(dpr+(fps<53?-.15:fps>58?.05:0),.7,limit);
        if(next!==dpr){ dpr=next; resize(); }
        frames=0; sample=0;
      }
    }
    world.update(ride); skier.update(ride,input,camera,time,dt); effects.update(ride,active?dt:0);
    camera.updateMatrixWorld(); scene.updateMatrixWorld();
    solarPoint.copy(sunDirection).multiplyScalar(1100).add(camera.position).project(camera);
    if(now-occlusionTime>120 || occlusionTime<0){
      ray.set(camera.position,sunDirection);
      visibleSun=!ray.intersectObjects([...world.range.children,...world.tiles,...world.rocks],false).length;
      occlusionTime=now;
    }
    const intensity=visibleSun && solarPoint.z<1 ? clamp(1-Math.hypot(solarPoint.x,solarPoint.y)*.78,0,1):0;
    glare.style.opacity=intensity;
    glare.style.setProperty("--sx",((solarPoint.x+1)*50)+"%");
    glare.style.setProperty("--sy",((1-solarPoint.y)*50)+"%");
    glare.style.setProperty("--gx",((1-solarPoint.x*.62)*50)+"%");
    glare.style.setProperty("--gy",((1+solarPoint.y*.62)*50)+"%");
    renderer.render(scene,camera);
  }
  let failed=false;
  function stopWithError(message){
    failed=true;
    active=false;
    renderer.setAnimationLoop(null);
    showError(message);
  }
  canvas.addEventListener("webglcontextlost",()=>{
    stopWithError("WebGL bağlantısı kesildi. Oyunu sürdürmek için dosyayı yeniden aç.");
  });
  resize();
  frame(performance.now());
  const problem=renderer.info.programs.find(p=>p.diagnostics && !p.diagnostics.runnable);
  if(problem){
    const d=problem.diagnostics;
    throw new Error("WebGL gölgelendiricisi derlenemedi. "+(d.programLog || d.fragmentShader.log || d.vertexShader.log));
  }
  statusLine.hidden=true;
  start.disabled=false; start.onclick=()=>setActive(true); pause.onclick=()=>setActive(false);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden && active)setActive(false); });
  addEventListener("blur",()=>{ if(active)setActive(false); });
  function draw(now){
    try { frame(now); }
    catch(error){ stopWithError("WebGL sahnesi çizilemedi. "+error.message); }
  }
  renderer.setAnimationLoop(now=>{ if(active) draw(now); });
  addEventListener("resize",()=>{
    if(failed) return;
    resize();
    if(!active) draw(performance.now());
  });
}
launch();
}
catch(error){
  showError(error.message || String(error));
  console.error(error);
}
</script>
</body></html>
